# Production only (docker-compose.prod.yml mounts it next to the site config).
# Requests reach nginx from Caddy over the compose network, so $remote_addr is
# Caddy's address. Caddy puts the visitor's address in X-Forwarded-For; take it
# from there, trusting the header only from private (container) addresses.
# nginx publishes no port in production, so nothing else can send it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
