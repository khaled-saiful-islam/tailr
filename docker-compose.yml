name: tailr

x-backend: &backend
  build:
    context: ./backend
  image: tailr-backend:latest
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tailr}:${POSTGRES_PASSWORD:-tailr}@db:5432/${POSTGRES_DB:-tailr}
    REDIS_URL: redis://redis:6379/0
    RENDERER_URL: http://renderer:8406
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    STORAGE_DIR: /srv/data/files
  volumes:
    - tailr-files:/srv/data/files
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: tailr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tailr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tailr}
      POSTGRES_DB: ${POSTGRES_DB:-tailr}
    volumes:
      - tailr-db:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-8402}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tailr} -d ${POSTGRES_DB:-tailr}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: tailr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tailr-redis:/data
    ports:
      - "${REDIS_PORT:-8404}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    <<: *backend
    container_name: tailr-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tailr}:${POSTGRES_PASSWORD:-tailr}@db:5432/${POSTGRES_DB:-tailr}
      REDIS_URL: redis://redis:6379/0
      RENDERER_URL: http://renderer:8406
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STORAGE_DIR: /srv/data/files
      RUN_MIGRATIONS: "1"
    ports:
      - "${API_PORT:-8401}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    <<: *backend
    container_name: tailr-worker
    command: ["taskiq", "worker", "app.worker:broker", "app.tasks", "--workers", "2", "--max-async-tasks", "20"]
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *backend
    container_name: tailr-scheduler
    command: ["taskiq", "scheduler", "app.worker:scheduler", "app.tasks"]
    depends_on:
      backend:
        condition: service_healthy

  renderer:
    build:
      context: ./renderer
    image: tailr-renderer:latest
    container_name: tailr-renderer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8406/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: tailr-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_UI_PORT:-8405}:8025"

  frontend:
    build:
      context: ./frontend
    image: tailr-frontend:latest
    container_name: tailr-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8400}:80"

volumes:
  tailr-db:
  tailr-redis:
  tailr-files:
