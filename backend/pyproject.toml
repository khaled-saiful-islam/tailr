[project]
name = "tailr-backend"
version = "0.1.0"
description = "Tailr API and workers: jobs that fit, applications made to measure."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "selectolax>=0.3.27",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "pillow>=11.0",
    "filetype>=1.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.2",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "time-machine>=2.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "S", "PT"]
ignore = ["S101", "B008", "RUF012", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:taskiq.*"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async runs code inside greenlets; trace them too.
concurrency = ["greenlet", "thread"]
omit = ["app/scripts/*"]
