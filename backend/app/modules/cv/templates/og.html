<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  {{ font_faces | safe }}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #eef0f4; font-family: "Schibsted Grotesk", Arial, sans-serif; color: #171b24; position: relative; }
  .glow { position: absolute; right: -120px; top: -160px; width: 760px; height: 760px; border-radius: 50%; background: {{ accent_soft }}; }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .tag { align-self: flex-start; font-size: 22px; font-weight: 700; color: {{ accent }}; border: 2px solid {{ accent }}; border-radius: 999px; padding: 6px 18px; }
  h1 { margin-top: 26px; font-family: "Newsreader", Georgia, serif; font-weight: 600; font-size: {{ name_size }}px; line-height: 1.02; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .headline { margin-top: 18px; font-size: 30px; line-height: 1.3; color: #454c5b; }
  .site { position: absolute; left: 72px; bottom: 54px; font-size: 22px; color: #697080; }
  .site b { color: #171b24; }
  .sheet { position: absolute; right: 70px; top: 46px; width: 794px; height: 1123px; transform: scale(0.56) rotate(-3deg); transform-origin: top right; background: #fff; box-shadow: 0 30px 80px -20px rgb(23 27 36 / 0.45); overflow: hidden; }
  .sheet iframe { width: 794px; height: 1123px; border: 0; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="text">
    <span class="tag">CV</span>
    <h1>{{ name }}</h1>
    {% if headline %}<p class="headline">{{ headline }}</p>{% endif %}
  </div>
  <p class="site"><b>tailr</b> {{ path }}</p>
  <div class="sheet"><iframe srcdoc="{{ document }}" title=""></iframe></div>
</body>
</html>
