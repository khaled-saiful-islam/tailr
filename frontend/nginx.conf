# X-Forwarded-For is the address nginx saw, never one the visitor sent (rate limits key on
# it). Behind a CDN, add set_real_ip_from <its ranges> and real_ip_header so $remote_addr
# is the visitor.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # The kit preview embeds our own /api documents in an iframe; nothing else may frame us.
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Live events (SSE): no buffering, long-lived.
  location /api/v1/events {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # Public pages: the backend writes their link-preview tags into public.html.
  # /cv/<slug> is the online CV; /p/<slug>/... is the portfolio site and its pages.
  location ~ ^/(cv/[a-z0-9-]+/?|p/[a-z0-9-]+(/[a-z0-9-]+)*/?)$ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The shell the backend fills in; not a page of its own.
  location = /public.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Fingerprinted assets never change; cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Everything else is the single-page app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
